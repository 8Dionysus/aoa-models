schema_version = "aoa_models_landing_readiness_packet_v1"
model_study_id = "model-study:external-codex/landing-readiness-repair-v2/2026-08-01"
task_family = "landing_readiness"
role_id = "reviewer"
role_contract_ref = "agents/roles/reviewer/specializations/route-drift-review/specialization.json"
parent_task_id = "goal:019fbb8a-e084-7e73-9a98-647a1dd76985"
target_owner = "abyss-stack"
return_owner = "abyss-stack"
allowed_effect_class = "read_only"
allowed_paths = ["DESIGN.md", "ROADMAP.md", "docs", "mechanics", "scripts"]
authority_scope = ["abyss-stack"]
objective = """
Проведи независимую read-only оценку landing readiness точного незакоммиченного change set external-codex-agent в переданном worktree abyss-stack после repairs, вызванных первым fixed trial. Сначала прочитай и соблюдай иерархию AGENTS.md, затем точные immutable inputs model-study, study-packet и workspace-manifest. Исследуй весь diff относительно закреплённого HEAD. Особенно проверь byte-aware end-of-run manifest, полный validation-claim contract, сохранение schema-valid report после token/turn overrun, descendant process-group termination, controlled interrupt/resume, точность --aoa-sdk-root, wrapper/test/CI inventories, owner boundaries, typed C2/incarnation/runtime связность, документацию, decision topology и явные residuals. Выполни все фиксированные validation commands; TMPDIR=/dev/shm является допущенным bounded scratch только для pytest. Для каждого failed или skipped результата назови точную evidence. Верни только schema-valid evidence-bearing report. Не меняй файлы, не объявляй owner acceptance или model fit и не выполняй никаких внешних эффектов.
"""
from_status = "repaired_candidate"
target_status = "readiness_assessed"
approval_posture = "human_owner_and_aoa_evals_review_required"
rollback_reentry_route = "preserve_exact_worktree_and_return_evidence_to_parent"
ambiguity_policy = "escalate"
review_required = true
done_state = [
  "Весь exact diff и ближайшие owner contracts проверены, либо каждый недоступный участок явно назван.",
  "Каждый finding имеет severity, category и проверяемые evidence refs.",
  "Каждая фиксированная validation command имеет ровно один passed, failed или skipped claim с непустой evidence ref.",
  "Отдельно оценены byte manifest, process lifecycle, budget/report preservation, SDK source binding, topology и C2 semantic residual.",
  "Итог не претендует на owner acceptance, landing completion, eval verdict или model fit."
]
expected_artifacts = ["structured_landing_readiness_report"]
forbidden_effects = [
  "commit",
  "push",
  "pull_request",
  "merge",
  "tag",
  "release",
  "publication",
  "service_mutation",
  "secret_access",
  "global_config_mutation"
]
rubric = [
  "Correctness: findings agree with exact source, contracts, schemas, tests and Git evidence.",
  "Coverage: owner boundaries, C2 binding, runtime lifecycle, exact byte drift, review/A2A return and residuals are all addressed.",
  "Evidence quality: claims cite concrete files, commands, outputs or immutable refs and separate source proof from runtime proof.",
  "Stop-line discipline: no mutation, owner acceptance, proof verdict, model-fit conclusion or external effect is claimed.",
  "Usefulness: the report distinguishes blockers, repairs, review needs and safe next routes without architecture invention.",
  "Efficiency: useful evidence and judgment per wall time, raw Codex-reported tokens, commands and parent re-entry."
]

[budget]
wall_time_seconds = 1800
max_turns = 12
max_output_bytes = 8388608
token_budget = 6000000
metering_regime = "chatgpt_quota"

