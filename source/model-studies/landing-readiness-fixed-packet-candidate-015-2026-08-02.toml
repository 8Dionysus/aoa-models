authority_scope = ["abyss-stack"]
objective = """
Проведи read-only landing-readiness оценку exact candidate-015 external-codex-agent. Это отдельный external Codex writer, не встроенный Codex sub-agent, не owner-contour admission и не доказательство всей будущей системы aoa-agents.

Candidate-014 является неизменяемой counterevidence. Sol max обнаружил три блокера: старый GitHub CI pin на aoa-sdk без нового incarnation ABI, пропущенную связь review-workspace-manifest с final manifest writer'а и обход effect observer через точную runtime wrapper форму `/usr/bin/env -C ... --`. Luna max и Luna xhigh эти три блокера не обнаружили. Отдельный Luna max reviewer нашёл два других blocking route-drift gap: отсутствие нового part в canonical topology/required-file catalogs и отсутствие его схем в active schema manifest. Reviewed A2A return честно вернул `return_for_repair`. Текущий candidate должен независимо проверить source repairs всех четырёх локально исправимых классов и сохранить CI SDK pin как отдельную dependency/landing-order обязанность до появления адресуемого SDK-коммита. Не повышай candidate-014 до accepted fit, owner acceptance или landing.

Проверь observe-only usage metering с execution_limit_policy=none и фактическим подсчётом tokens/time/turns/output/commands; admission-time persisted failure closeout; stable anchored source:<path>#... и immutable:<stable-input-id>#... evidence refs; exact runtime:validation:<command-id> claims; canonical reviewer preparation с отдельными task/incarnation/session и SDK summon request/decision; exact review-input-to-writer-final manifest binding; wrapper-delimiter effect observation; canonical part topology, required-file and schema-manifest coverage; read-only target projection through a distinct attempt-local execution root; signal-driven supervisor and identity-checked descendant cleanup; byte-aware final manifest; secret-shaped refusal; produced-artifact admission; status-selected wake; failed-reviewer A2A refusal; SDK provenance; CI, docs and decision history.

Отдельно проверь owner split: aoa-sdk A2A request/decision остаются каноническими transport artifacts, abyss-stack owns terminal/runtime/A2A-return artifacts, and an aoa-agents execution leaf may only reference those exact bytes rather than replace their protocols. Не требуй наличия ещё не опубликованного aoa-agents root skill внутри этого runtime study.

Каждый transition/finding evidence ref в собственном report обязан быть либо существующим anchored source ref внутри exact workspace, либо anchored immutable ref через стабильный input_id из task. Каждый validation claim обязан ссылаться на exact runtime:validation:<command-id>. Не используй artifact:, ordinal immutable IDs или непрозрачные строки. Выполни одиннадцать validation commands точным argv из workspace root. TMPDIR=/dev/shm и закреплённый PYTHONPYCACHEPREFIX=/dev/shm являются единственным bounded scratch; это storage hygiene, не execution budget. Не меняй workspace, не читай secrets, не объявляй owner acceptance, eval verdict, model fit или landing completion и не выполняй внешних эффектов. Поскольку writer review_required=true, пригодный writer-result обязан вернуть status=review_required, condition_id=review-required, proposed_action=activate_review_role и artifact_paths=[].
"""
from_status = "post_candidate_014_reviewed_source_repair"
target_status = "readiness_assessed"
approval_posture = "human_owner_and_aoa_evals_review_required"
rollback_reentry_route = "preserve_exact_worktree_and_return_evidence_to_parent"
ambiguity_policy = "escalate"
review_required = true
done_state = [
  "Весь exact diff и ближайшие owner contracts проверены, либо каждый недоступный участок явно назван.",
  "Wrapper-delimiter effect observation, exact review-manifest chain, topology/required-file catalogs и active schema manifest проверены отдельно.",
  "Каждый finding имеет калиброванную severity и только существующие anchored source или stable immutable evidence refs.",
  "Все одиннадцать fixed validation commands имеют ровно один claim с exact runtime:validation:<command-id> и совпадающим runtime-observed argv/exit code.",
  "Observe-only metering, durable failure closeout, canonical reviewer preparation, process containment, SDK provenance, byte manifest, effect and review/wake/A2A gates оценены отдельно.",
  "Candidate-014 counterevidence не повышена до accepted review, model fit, owner acceptance или landing.",
  "Read-only report использует artifact_paths=[] и status-selected review-required re-entry без wake_parent."
]
expected_artifacts = ["runtime-owned structured model report; no workspace artifact is expected"]
forbidden_effects = [
  "commit",
  "push",
  "pull_request",
  "merge",
  "tag",
  "release",
  "publication",
  "service_mutation",
  "secret_access",
  "global_config_mutation"
]
rubric = [
  "Correctness: findings agree with exact source, contracts, schemas, tests, Git and immutable runtime evidence.",
  "Coverage: report/manifest tamper gates, admission class, metering, durable failure closeout, evidence binding, canonical review preparation, containment, SDK provenance, artifacts, wake, ignored bytes, effects and validation binding are addressed.",
  "Evidence quality: every source/immutable ref resolves through the admitted registry and every validation ref names an exact runtime command ID.",
  "Owner discipline: SDK/runtime artifacts keep their own protocol identity; no owner-local actor receipt is treated as their replacement.",
  "Stop-line discipline: no mutation, owner acceptance, proof verdict, model-fit conclusion or external effect is claimed.",
  "Usefulness: blockers and safe next routes are explicit without inventing owner semantics.",
  "Efficiency: useful evidence and judgment per measured wall time, raw Codex tokens, commands, review/rework and parent re-entry; no pre-run budget is treated as quality."
]

